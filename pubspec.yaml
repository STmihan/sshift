name: sshift
description: Simplified shift calendar with earnings tracking.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  cross_file: ^0.3.5+5
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_timezone: ^5.1.1
  go_router: ^18.1.1
  http: ^1.6.0
  image_picker: ^1.2.4
  intl: ^0.20.2
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pub_semver: ^2.2.1
  talker_flutter: ^5.1.20
  talker_riverpod_logger: ^5.1.20
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  build_runner: ^2.15.1
  drift_dev: ^2.35.1
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
